<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aldern-voss/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A self-initiated concept, not a real business — kept out of the
         index but still crawlable. This is a client-rendered SPA with no
         per-route head management for robots, so one static tag covers
         every route rather than needing one per page. -->
    <meta name="robots" content="noindex, follow" />

    <!-- Defaults for the pre-hydration and no-JavaScript case. React 19
         hoists each route's own <title> and description into <head> once it
         renders, replacing these. They carry the threshold's values because
         that is the entrance and the only URL a crawler is likely to reach
         without executing JavaScript. -->
    <title data-default>Aldern &amp; Voss — Independent Swiss Watchmaker | Clerkenwell &amp; Florence</title>
    <meta
      data-default
      name="description"
      content="A single automatic reference, handmade in small number by an independent Swiss watchmaker uniting Clerkenwell horology and Florentine leathercraft. Request consideration — no price shown until accepted."
    />
    <script type="module" crossorigin src="/aldern-voss/assets/index-BerCEc2a.js"></script>
    <link rel="stylesheet" crossorigin href="/aldern-voss/assets/index-CLSLrYWC.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
